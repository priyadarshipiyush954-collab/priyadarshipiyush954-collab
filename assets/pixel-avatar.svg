<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" shape-rendering="crispEdges">
  <defs>
    <clipPath id="face"><rect x="96" y="72" width="128" height="128" rx="8"/></clipPath>
    <style>
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes scan{0%{transform:translateY(0);opacity:.15}50%{opacity:.55}100%{transform:translateY(112px);opacity:.15}}
      @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
      @keyframes sparkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
      .float{animation:float 4s ease-in-out infinite}.scan{animation:scan 3s linear infinite}.blink{transform-origin:center;animation:blink 5s steps(1,end) infinite}.spark{animation:sparkle 2s ease-in-out infinite}.d2{animation-delay:.5s}.d3{animation-delay:1s}
    </style>
  </defs>
  <rect width="320" height="320" rx="26" fill="#020617"/>
  <rect x="14" y="14" width="292" height="292" rx="20" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <g class="spark"><rect x="38" y="50" width="6" height="6" fill="#7dd3fc"/><rect x="54" y="40" width="4" height="4" fill="#a7f3d0"/></g>
  <g class="spark d2"><rect x="262" y="74" width="5" height="5" fill="#f0abfc"/><rect x="276" y="58" width="3" height="3" fill="#fef08a"/></g>
  <g class="spark d3"><rect x="42" y="248" width="4" height="4" fill="#fef08a"/><rect x="270" y="232" width="6" height="6" fill="#7dd3fc"/></g>
  <g class="float">
    <rect x="84" y="56" width="152" height="20" rx="4" fill="#0ea5e9" opacity=".9"/>
    <rect x="92" y="76" width="136" height="124" rx="10" fill="#111827" stroke="#22d3ee" stroke-width="4"/>
    <image href="https://raw.githubusercontent.com/priyadarshipiyush954-collab/priyadarshipiyush954-collab/main/assets/avatar.jpg" x="96" y="72" width="128" height="128" preserveAspectRatio="xMidYMid slice" clip-path="url(#face)"/>
    <rect x="96" y="72" width="128" height="128" fill="none" stroke="#a5f3fc" stroke-width="2"/>
    <rect x="100" y="108" width="120" height="3" fill="#67e8f9" class="scan" opacity=".3"/>
    <g class="blink"><rect x="115" y="125" width="10" height="5" fill="#020617"/><rect x="195" y="125" width="10" height="5" fill="#020617"/></g>
    <rect x="141" y="164" width="38" height="5" fill="#020617"/>
    <rect x="133" y="205" width="54" height="9" rx="2" fill="#0f172a" stroke="#22c55e"/>
    <circle cx="144" cy="209" r="3" fill="#22c55e"/>
    <text x="151" y="213" fill="#bbf7d0" font-family="monospace" font-size="7" font-weight="700">ONLINE</text>
  </g>
  <g fill="#22d3ee" opacity=".7"><rect x="42" y="285" width="54" height="3"/><rect x="106" y="285" width="24" height="3"/><rect x="140" y="285" width="76" height="3"/><rect x="226" y="285" width="38" height="3"/></g>
  <text x="160" y="28" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="9" font-weight="700" letter-spacing="2">PIYUSH.EXE</text>
</svg>
