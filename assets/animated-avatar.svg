<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <clipPath id="avatar-clip"><circle cx="140" cy="140" r="76" /></clipPath>
    <linearGradient id="ring-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" /><stop offset="50%" stop-color="#4facfe" /><stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" /><stop offset="100%" stop-color="#4facfe" stop-opacity="0" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="pulse-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" /><feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      @keyframes rotateClockwise{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
      @keyframes rotateCounter{0%{transform:rotate(360deg)}100%{transform:rotate(0deg)}}
      @keyframes breathGlow{0%,100%{opacity:.35;transform:scale(.97)}50%{opacity:.75;transform:scale(1.03)}}
      @keyframes pingDot{0%,100%{r:5;opacity:1}50%{r:8;opacity:.5}}
      @keyframes floatEffect{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      .center-origin{transform-origin:140px 140px}.spin-slow{animation:rotateClockwise 14s linear infinite}.spin-reverse{animation:rotateCounter 10s linear infinite}.spin-fast{animation:rotateClockwise 6s linear infinite}.breathe{animation:breathGlow 4s ease-in-out infinite}.floating{animation:floatEffect 5s ease-in-out infinite}.pulse-indicator{animation:pingDot 2s ease-in-out infinite}
    </style>
  </defs>
  <circle cx="140" cy="140" r="92" fill="url(#glow-grad)" filter="url(#pulse-blur)" class="center-origin breathe" />
  <circle cx="140" cy="140" r="108" fill="none" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="8 12 24 12" stroke-opacity=".6" class="center-origin spin-slow" />
  <circle cx="140" cy="140" r="98" fill="none" stroke="url(#ring-grad-1)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="35 55 15 40 60 25" filter="url(#neon-glow)" class="center-origin spin-reverse" />
  <g class="center-origin spin-fast"><circle cx="140" cy="38" r="4.5" fill="#00f2fe" filter="url(#neon-glow)" /><circle cx="140" cy="242" r="3" fill="#38ef7d" filter="url(#neon-glow)" /></g>
  <path d="M40 70V40H70M240 70V40H210M40 210v30h30M240 210v30h-30" fill="none" stroke="#00c6ff" stroke-width="2" stroke-linecap="round" opacity=".7" />
  <circle cx="140" cy="140" r="82" fill="#0f172a" stroke="#1e293b" stroke-width="4" /><circle cx="140" cy="140" r="79" fill="none" stroke="url(#ring-grad-1)" stroke-width="2.5" />
  <g class="center-origin floating"><image href="https://raw.githubusercontent.com/priyadarshipiyush954-collab/priyadarshipiyush954-collab/main/assets/avatar.jpg" x="64" y="64" width="152" height="152" clip-path="url(#avatar-clip)" preserveAspectRatio="xMidYMid slice" /></g>
  <g transform="translate(70,222)"><rect width="140" height="26" rx="13" fill="#090d16" stroke="#00f2fe" stroke-width="1.2" filter="url(#neon-glow)" opacity=".95" /><circle cx="20" cy="13" r="5" fill="#34d399" class="center-origin pulse-indicator" /><circle cx="20" cy="13" r="3" fill="#10b981" /><text x="34" y="17" fill="#e2e8f0" font-family="Fira Code,ui-monospace,monospace" font-size="10" font-weight="600" letter-spacing=".5">OPEN TO WORK</text></g>
</svg>
