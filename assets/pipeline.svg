<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="How I work: question, data, model or benchmark, honest validation, ship">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6DD5FA"/><stop offset="1" stop-color="#2980B9"/>
    </linearGradient>
    <style>
      .box{fill:#0D1117;stroke:url(#bar);stroke-width:2}
      .lbl{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#C9D1D9;text-anchor:middle}
      .sub{font:12px 'Segoe UI',Arial,sans-serif;fill:#8B949E;text-anchor:middle}
      .flow{stroke:#58A6FF;stroke-width:2;stroke-dasharray:6 6;animation:dash 1s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-12}}
    </style>
  </defs>
  <rect width="900" height="150" rx="14" fill="#0D1117"/>
  <line class="flow" x1="150" y1="70" x2="195" y2="70"/>
  <line class="flow" x1="345" y1="70" x2="390" y2="70"/>
  <line class="flow" x1="540" y1="70" x2="585" y2="70"/>
  <line class="flow" x1="735" y1="70" x2="780" y2="70"/>
  <g>
    <rect class="box" x="20" y="35" width="130" height="70" rx="10"/>
    <text class="lbl" x="85" y="66">Question</text><text class="sub" x="85" y="86">real problem</text>
    <rect class="box" x="195" y="35" width="150" height="70" rx="10"/>
    <text class="lbl" x="270" y="66">Data</text><text class="sub" x="270" y="86">public sources</text>
    <rect class="box" x="390" y="35" width="150" height="70" rx="10"/>
    <text class="lbl" x="465" y="66">Model / Bench</text><text class="sub" x="465" y="86">baseline first</text>
    <rect class="box" x="585" y="35" width="150" height="70" rx="10"/>
    <text class="lbl" x="660" y="66">Validate</text><text class="sub" x="660" y="86">held-out, honest</text>
    <rect class="box" x="780" y="35" width="100" height="70" rx="10"/>
    <text class="lbl" x="830" y="66">Ship</text><text class="sub" x="830" y="86">demo + docs</text>
  </g>
  <circle r="6" fill="#6DD5FA">
    <animateMotion dur="5s" repeatCount="indefinite" path="M85,70 L830,70"/>
    <animate attributeName="opacity" values="0;1;1;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
